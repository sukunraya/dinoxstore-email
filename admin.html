<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DINOXSTORE - Admin Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        DINOXSTORE
      </div>

      <div id="loginSection">

        <h1>Admin Login</h1>

        <p class="description">
          กรุณาเข้าสู่ระบบผู้ดูแล
        </p>

        <input
          type="text"
          id="username"
          placeholder="Username"
          autocomplete="username"
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button id="loginButton">
          เข้าสู่ระบบ
        </button>

        <div id="loginMessage"></div>

      </div>


      <div
        id="adminSection"
        style="display:none;"
      >

        <h1>จัดการ Email</h1>

        <p class="description">
          รายการ Email ในระบบ
        </p>

        <div class="count-box">

          <span>
            จำนวน Email
          </span>

          <strong id="emailCount">
            0
          </strong>

        </div>

        <input
          type="search"
          id="search"
          placeholder="ค้นหา Email..."
        >

        <div id="emailList">
          กำลังโหลด...
        </div>

        <button
          id="logoutButton"
          type="button"
        >
          ออกจากระบบ
        </button>

      </div>

    </div>

  </div>

  <script src="admin.js"></script>

</body>

</html>
