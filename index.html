<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DINOXSTORE - เพิ่ม Email</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        DINOXSTORE
      </div>

      <h1>เพิ่ม Email</h1>

      <p class="description">
        กรอก Email เพื่อเพิ่มข้อมูลเข้าระบบ
      </p>

      <form id="emailForm">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="example@gmail.com"
          required
        >

        <button
          type="submit"
          id="submitButton"
        >
          เพิ่ม Email
        </button>

      </form>

      <div id="message"></div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
